<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dive flag (Alpha flag - blue and white) -->
  <rect x="12" y="8" width="40" height="28" rx="1" fill="#003366"/>
  <!-- White swallowtail cut -->
  <polygon points="12,8 32,22 12,36" fill="white"/>
  <!-- Flagpole -->
  <line x1="12" y1="4" x2="12" y2="58" stroke="#666" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ball on top -->
  <circle cx="12" cy="4" r="2.5" fill="#888"/>
  <!-- CEP text -->
  <text x="38" y="26" text-anchor="middle" font-size="8" font-weight="bold" fill="#d4a843" font-family="serif">CEP</text>
</svg>
