<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Sun with rays - holiday/beach vibe -->
  <circle cx="32" cy="32" r="12" fill="#ffc107"/>
  <circle cx="32" cy="32" r="10" fill="#ffd54f"/>
  <!-- Rays -->
  <g stroke="#ffc107" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="4" x2="32" y2="14"/>
    <line x1="32" y1="50" x2="32" y2="60"/>
    <line x1="4" y1="32" x2="14" y2="32"/>
    <line x1="50" y1="32" x2="60" y2="32"/>
    <line x1="12" y1="12" x2="19" y2="19"/>
    <line x1="45" y1="45" x2="52" y2="52"/>
    <line x1="52" y1="12" x2="45" y2="19"/>
    <line x1="19" y1="45" x2="12" y2="52"/>
  </g>
  <!-- Smile -->
  <path d="M26 34 Q32 40 38 34" stroke="#e6a000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="27" cy="30" r="1.5" fill="#e6a000"/>
  <circle cx="37" cy="30" r="1.5" fill="#e6a000"/>
</svg>
