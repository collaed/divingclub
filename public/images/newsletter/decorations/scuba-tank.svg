<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Scuba tank + regulator -->
  <rect x="22" y="12" width="20" height="40" rx="8" fill="#5a5a6e" stroke="#444" stroke-width="1"/>
  <!-- Valve -->
  <rect x="28" y="6" width="8" height="8" rx="2" fill="#777"/>
  <circle cx="32" cy="8" r="2" fill="#999"/>
  <!-- Regulator hose -->
  <path d="M36 10 Q46 10 48 18 Q50 26 46 30" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Mouthpiece -->
  <ellipse cx="46" cy="32" rx="5" ry="3" fill="#444"/>
  <!-- Tank bands -->
  <rect x="20" y="24" width="24" height="3" rx="1" fill="#333" opacity="0.5"/>
  <rect x="20" y="40" width="24" height="3" rx="1" fill="#333" opacity="0.5"/>
  <!-- Pressure gauge hint -->
  <circle cx="18" cy="20" r="4" fill="#222" stroke="#555" stroke-width="0.8"/>
  <path d="M18 20 L18 17" stroke="#0f0" stroke-width="1"/>
</svg>
