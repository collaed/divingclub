name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Pint (code style)
        run: vendor/bin/pint --test
      - name: PHPStan (level 6)
        run: vendor/bin/phpstan analyse --no-progress

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: divingclub_test
          POSTGRES_USER: divingclub
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, gd, zip, intl, bcmath
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Setup .env
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=3306/DB_PORT=5432/' .env
          sed -i 's/DB_DATABASE=divingclub/DB_DATABASE=divingclub_test/' .env
          sed -i 's/DB_USERNAME=divingclub/DB_USERNAME=divingclub/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=secret/' .env
          php artisan key:generate
      - name: Migrate
        run: php artisan migrate --force
      - name: PHPUnit
        run: php artisan test --compact

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Verify build artifacts
        run: test -f public/build/manifest.json
