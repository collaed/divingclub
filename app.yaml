kind: wasmer.io/App.v0
name: clubcep
app_id: da_nm3IetwUkO1G
owner: eddycollart
package: .
locality:
  regions:
  - fr-pari1
capabilities:
  database:
    engine: mysql
debug: true
scaling:
  mode: single_concurrency
redirect:
  force_https: true
jobs:
- name: schedule-runner
  trigger: '*/1 * * * *'
  action:
    fetch:
      path: /cron/run-schedule?key=4c28b976cc17277dd9e456919da0b83a4eeb260a1ec0b16e5ca3a92f5a4543da
      timeout: 30s
- name: medical-reminders
  trigger: 0 8 * * *
  action:
    fetch:
      path: /cron/medical-reminders?key=4c28b976cc17277dd9e456919da0b83a4eeb260a1ec0b16e5ca3a92f5a4543da
      timeout: 60s
- name: weekly-backup
  trigger: 0 3 * * 7
  action:
    fetch:
      path: /cron/weekly-backup?key=4c28b976cc17277dd9e456919da0b83a4eeb260a1ec0b16e5ca3a92f5a4543da
      timeout: 120s
- name: post-deploy-warmup
  trigger: post-deployment
  action:
    fetch:
      path: /
      timeout: 30s
description: DivingClub-Manager — Diving club management system
